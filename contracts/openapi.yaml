openapi: 3.1.0
info:
  title: BabyRadnik API
  version: 0.1.0
  description: |
    Kontrakt API (instrukcja, sekcja 12.1). Zmienia wyłącznie koordynator po zgodzie zatwierdzającego.
    Wszystkie integracje są symulowane. Błędy jako application/problem+json (RFC 9457).
    Schematy danych są w plikach JSON Schema obok (facts, assessment, case, persona, parameters).
servers:
  - url: http://localhost:5080
tags:
  - name: stan
  - name: symulacja
  - name: ocena
  - name: zgłoszenia
  - name: sprawy
  - name: wsparcie
  - name: admin
  - name: pomocnik

components:
  securitySchemes:
    simSession:
      type: apiKey
      in: header
      name: X-Sim-Session
      description: Identyfikator sesji z POST /api/sim/login. Sesja przechowuje tylko id osoby — nigdy PESEL.
    adminPassword:
      type: apiKey
      in: header
      name: X-Admin-Password
      description: Hasło z zmiennej środowiskowej ADMIN_PASSWORD.
  responses:
    Problem:
      description: Błąd (ProblemDetails)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    NotImplemented:
      description: Endpoint jeszcze nie zaimplementowany (atrapa szkieletu)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
  schemas:
    ProblemDetails:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        errors:
          type: object
          additionalProperties: { type: array, items: { type: string } }
    Health:
      type: object
      required: [status, api, database]
      properties:
        status: { enum: [ok, degraded] }
        api: { enum: [ok] }
        database: { enum: [ok, unavailable] }
    FactSet: { $ref: 'facts.schema.json' }
    AssessmentRequest: { $ref: 'assessment.schema.json#/$defs/AssessmentRequest' }
    AssessmentResult: { $ref: 'assessment.schema.json#/$defs/AssessmentResult' }
    CompareRequest: { $ref: 'assessment.schema.json#/$defs/CompareRequest' }
    CompareResult: { $ref: 'assessment.schema.json#/$defs/CompareResult' }
    CaseSummary: { $ref: 'case.schema.json#/$defs/CaseSummary' }
    Parameter: { $ref: 'parameters.schema.json#/$defs/parametr' }
    Identity:
      type: object
      required: [imie, nazwisko, pesel, dataUrodzenia]
      properties:
        imie: { type: string }
        nazwisko: { type: string }
        nazwiskoRodowe: { type: [string, 'null'] }
        pesel: { type: string, description: 'Fikcyjny. Tylko do wyświetlenia przy logowaniu; frontend nie przechowuje go i nie wysyła dalej.' }
        dataUrodzenia: { type: string, format: date }
    LoginRequest:
      type: object
      required: [personaId]
      properties:
        personaId: { type: string }
    LoginResponse:
      type: object
      required: [sessionId, identity, simulated]
      properties:
        sessionId: { type: string }
        identity: { $ref: '#/components/schemas/Identity' }
        simulated: { const: true }
    PersonaListItem:
      type: object
      required: [id, opis]
      properties:
        id: { type: string }
        opis: { type: string }
        imie: { type: string }
        caseId: { type: [string, 'null'] }
    ZusAccount:
      type: object
      description: Ekran „Moje dane w ZUS (symulacja)”.
      required: [simulated, tytuly, podstawySkladek, przerwy, pobraneSwiadczenia, zwolnienia]
      properties:
        simulated: { const: true }
        tytuly: { type: array, items: { $ref: 'facts.schema.json#/$defs/tytulUbezpieczenia' } }
        podstawySkladek: { type: array, items: { $ref: 'facts.schema.json#/$defs/podstawaSkladki' } }
        przerwy: { type: array, items: { $ref: 'facts.schema.json#/$defs/przerwa' } }
        pobraneSwiadczenia: { type: array, items: { $ref: 'facts.schema.json#/$defs/pobraneSwiadczenie' } }
        zwolnienia: { type: array, items: { $ref: 'facts.schema.json#/$defs/zwolnienieEzla' } }
        saldo:
          type: [object, 'null']
          properties:
            naDzien: { type: string, format: date }
            kwota: { type: number }
    SubmissionType:
      enum: [wniosek_urlop, dane_zam, zapytanie_ezus, odpis_aktu]
    LeaveTemplate:
      enum: [macierzynski_i_rodzicielski, rodzicielski, ojcowski, uzupelniajacy]
    SubmissionRequest:
      type: object
      required: [type, fields]
      properties:
        type: { $ref: '#/components/schemas/SubmissionType' }
        template: { $ref: '#/components/schemas/LeaveTemplate', description: 'Tylko dla wniosek_urlop.' }
        fields:
          type: object
          additionalProperties: { type: string }
          description: Pola formularza wg szablonu (rozporządzenie z 11.03.2025). Bez PESEL.
    TemplateField:
      type: object
      required: [key, label, kind, required, maxLength, basis]
      properties:
        key: { type: string }
        label: { type: string }
        kind: { enum: [text, longtext, date, integer, choice] }
        required: { type: boolean }
        maxLength: { type: integer }
        basis: { type: string, description: 'Podstawa pola (rozporządzenie z 11.03.2025).' }
        when:
          type: [object, 'null']
          description: 'Pole widoczne tylko, gdy inne pole ma podaną wartość.'
          properties:
            key: { type: string }
            value: { type: string }
        options:
          type: [array, 'null']
          items:
            type: object
            required: [value, label]
            properties:
              value: { type: string }
              label: { type: string }
    SubmissionTemplate:
      type: object
      required: [id, type, recipient, title, fields]
      properties:
        id: { type: string }
        type: { $ref: '#/components/schemas/SubmissionType' }
        template: { anyOf: [{ $ref: '#/components/schemas/LeaveTemplate' }, { type: 'null' }] }
        recipient: { enum: [pracodawca, zus, ezus, urzad_stanu_cywilnego] }
        title: { type: string }
        fields: { type: array, items: { $ref: '#/components/schemas/TemplateField' } }
    SubmissionReceipt:
      type: object
      required: [id, number, type, recipient, submittedAt, simulated]
      properties:
        id: { type: string }
        number: { type: string, description: Numer potwierdzenia (symulacja). }
        type: { $ref: '#/components/schemas/SubmissionType' }
        recipient: { enum: [pracodawca, zus, ezus, urzad_stanu_cywilnego] }
        submittedAt: { type: string, format: date-time }
        pdfUrl: { type: [string, 'null'], description: 'Pobranie wymaga nagłówka X-Sim-Session; null, gdy plik wygasł.' }
        status: { type: string }
        summary: { type: string, description: Streszczenie bez danych osobowych. }
        simulated: { const: true }
    SupportSituation:
      description: 'Sytuacje katalogu wsparcia (ekran „Wsparcie”, panel /admin). Frontend: web/src/app/situations.ts; backend: SupportSituations.cs.'
      enum: [poronienie, martwe_urodzenie, zgon_dziecka, wczesniak, ciezka_choroba_dziecka, sytuacja_matki, samotny_rodzic, trudna_sytuacja_materialna, przyjecie_dziecka]
    Organization:
      type: object
      required: [id, nazwa, opis, sytuacje, zweryfikowano]
      properties:
        id: { type: string }
        nazwa: { type: string }
        opis: { type: string }
        sytuacje: { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/SupportSituation' } }
        url: { type: [string, 'null'] }
        telefon: { type: [string, 'null'] }
        zweryfikowano: { type: boolean, description: 'Niezweryfikowanych nie pokazujemy (sekcja 14).' }
    ParameterChange:
      type: object
      required: [key, value, validFrom]
      properties:
        key: { type: string }
        value: { type: [number, string, 'null'] }
        validFrom: { type: string, format: date }
        legalBasis: { type: string }
        reason: { type: string }
        status:
          enum: [ok, do_weryfikacji]
          description: 'Status nowej wartości. Bez pola — status poprzedniej wartości tego klucza (do_weryfikacji nie znika po zmianie).'
    ParameterHistoryEntry:
      type: object
      required: [key, value, validFrom, changedAt]
      properties:
        key: { type: string }
        value: { type: [number, string, 'null'] }
        previousValue: { type: [number, string, 'null'] }
        validFrom: { type: string, format: date }
        changedAt: { type: string, format: date-time }
        reason: { type: [string, 'null'] }
    CatalogEntry:
      type: object
      required: [id, nazwa, wlaczone]
      properties:
        id: { $ref: 'assessment.schema.json#/$defs/benefitId' }
        nazwa: { type: string }
        wlaczone: { type: boolean }
    IntegrationField:
      type: object
      required: [source, fact, wlaczone]
      description: Wyłączenie pola integracji zamienia je w pytanie do użytkownika (sekcja 6.2).
      properties:
        source: { $ref: 'facts.schema.json#/$defs/zrodlo' }
        fact: { type: string }
        wlaczone: { type: boolean }
    AssistantQuestion:
      type: object
      required: [question]
      properties:
        question: { type: string, maxLength: 500, description: 'Pytanie ogólne. Bez danych osoby.' }
        previousQuestion: { type: string, maxLength: 500, description: 'Poprzednie ogólne pytanie używane przy dopytaniu.' }
    AssistantAnswer:
      type: object
      required: [answer, citations, disclaimer, mode]
      properties:
        answer: { type: string }
        mode: { type: string, enum: [faq, ai, search, no_results, calculator], description: 'faq: gotowa odpowiedź na typowe pytanie (bez modelu), z 1–2 cytatami.' }
        citations:
          type: array
          items:
            type: object
            required: [document, fragment, article, articleText]
            properties:
              document: { type: string, description: 'Nazwa aktu lub materiału pomocniczego.' }
              fragment: { type: string }
              article: { type: string }
              articleText: { type: string, description: 'Pełna treść sekcji z wyciągu.' }
              notes:
                type: array
                items: { type: string }
                description: 'Daty wejścia w życie lub brzmienia ustępów artykułu, odczytane z przypisów aktu.'
        disclaimer: { type: string }

paths:
  /health:
    get:
      tags: [stan]
      summary: Stan API i bazy
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } }
        '503': { description: Baza niedostępna, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } }

  /api/sim/login:
    post:
      tags: [symulacja]
      summary: Symulowane logowanie mObywatel → sesja + tożsamość
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/LoginResponse' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/NotImplemented' }
  /api/sim/personas:
    get:
      tags: [symulacja]
      summary: Lista fikcyjnych osób i spraw
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PersonaListItem' } } } } }
        '501': { $ref: '#/components/responses/NotImplemented' }
  /api/sim/me/facts:
    get:
      tags: [symulacja]
      summary: Fakty z integracji dla zalogowanej osoby (z oznaczeniem źródła)
      security: [{ simSession: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/FactSet' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/NotImplemented' }
  /api/sim/me/zus:
    get:
      tags: [symulacja]
      summary: Ubezpieczenia, podstawy, e-ZLA, saldo
      security: [{ simSession: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ZusAccount' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/NotImplemented' }
  /api/sim/me/debt-certificate:
    get:
      tags: [symulacja]
      summary: Symulowane zaświadczenie o stanie składek (PDF)
      security: [{ simSession: [] }]
      parameters:
        - { name: date, in: query, required: false, schema: { type: string, format: date } }
      responses:
        '200': { description: PDF, content: { application/pdf: { schema: { type: string, format: binary } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /api/assessment:
    post:
      tags: [ocena]
      summary: Fakty → wynik katalogu świadczeń
      description: Do czasu scalenia silnika zwraca atrapę contracts/examples/assessment.example.json.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AssessmentRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AssessmentResult' } } } }
        '400': { $ref: '#/components/responses/Problem' }
  /api/assessment/compare:
    post:
      tags: [ocena]
      summary: Fakty + scenariusz → wynik bazowy, wariant, różnica
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CompareRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CompareResult' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /api/submissions:
    post:
      tags: [zgłoszenia]
      summary: Symulowane zgłoszenie → numer + PDF, jeśli dotyczy
      security: [{ simSession: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SubmissionRequest' } } }
      responses:
        '201': { description: Utworzono, content: { application/json: { schema: { $ref: '#/components/schemas/SubmissionReceipt' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/NotImplemented' }
    get:
      tags: [zgłoszenia]
      summary: „Moje zgłoszenia”
      security: [{ simSession: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SubmissionReceipt' } } } } }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /api/submissions/document:
    post:
      tags: [zgłoszenia]
      summary: PDF wniosku do pracodawcy lub zestawienia ZAM bez logowania (nic nie jest zapisywane)
      description: Tylko typy wniosek_urlop i dane_zam. Zgłoszenia do ZUS (zapytanie_ezus) i urzędu (odpis_aktu) wymagają sesji profilu (POST /api/submissions).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SubmissionRequest' } } }
      responses:
        '200': { description: PDF, content: { application/pdf: { schema: { type: string, format: binary } } } }
        '400': { $ref: '#/components/responses/Problem' }
  /api/submissions/templates:
    get:
      tags: [zgłoszenia]
      summary: Szablony zgłoszeń i wniosków (pola formularzy)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SubmissionTemplate' } } } } }
  /api/submissions/{id}/pdf:
    get:
      tags: [zgłoszenia]
      summary: PDF zgłoszenia (symulacja)
      security: [{ simSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: PDF, content: { application/pdf: { schema: { type: string, format: binary } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /api/cases:
    get:
      tags: [sprawy]
      summary: Lista spraw testowych ZUS
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CaseSummary' } } } } }
        '501': { $ref: '#/components/responses/NotImplemented' }
  /api/cases/by-hash/{sha256}:
    get:
      tags: [sprawy]
      summary: Rozpoznanie pliku sprawy po SHA-256 (liczonym w przeglądarce)
      parameters:
        - { name: sha256, in: path, required: true, schema: { type: string, pattern: '^[0-9a-f]{64}$' } }
        - { name: fileName, in: query, required: false, schema: { type: string }, description: 'Zapas: nazwa pliku.' }
        - { name: pages, in: query, required: false, schema: { type: integer }, description: 'Zapas: liczba stron.' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CaseSummary' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /api/organizations:
    get:
      tags: [wsparcie]
      summary: Katalog wsparcia (tylko zweryfikowane)
      description: Zweryfikowane organizacje z listy zapisanej w panelu administratora lub z katalogu startowego, jeśli nie zapisano listy.
      parameters:
        - { name: situation, in: query, required: false, schema: { $ref: '#/components/schemas/SupportSituation' } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Organization' } } } } }
        '400': { $ref: '#/components/responses/Problem' }

  /api/admin/parameters:
    get:
      tags: [admin]
      security: [{ adminPassword: [] }]
      summary: Parametry z datami obowiązywania
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Parameter' } } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/NotImplemented' }
    put:
      tags: [admin]
      security: [{ adminPassword: [] }]
      summary: Dodanie wartości parametru obowiązującej od daty
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ParameterChange' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Parameter' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/NotImplemented' }
  /api/admin/parameters/history:
    get:
      tags: [admin]
      security: [{ adminPassword: [] }]
      summary: Historia zmian parametrów
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ParameterHistoryEntry' } } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/NotImplemented' }
  /api/admin/catalog:
    get:
      tags: [admin]
      security: [{ adminPassword: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CatalogEntry' } } } } }
        '501': { $ref: '#/components/responses/NotImplemented' }
    put:
      tags: [admin]
      security: [{ adminPassword: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CatalogEntry' } } } }
      responses:
        '200': { description: OK }
        '501': { $ref: '#/components/responses/NotImplemented' }
  /api/admin/integrations:
    get:
      tags: [admin]
      security: [{ adminPassword: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/IntegrationField' } } } } }
        '501': { $ref: '#/components/responses/NotImplemented' }
    put:
      tags: [admin]
      security: [{ adminPassword: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/IntegrationField' } } } }
      responses:
        '200': { description: OK }
        '501': { $ref: '#/components/responses/NotImplemented' }
  /api/admin/organizations:
    get:
      tags: [admin]
      security: [{ adminPassword: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Organization' } } } } }
        '501': { $ref: '#/components/responses/NotImplemented' }
    put:
      tags: [admin]
      security: [{ adminPassword: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Organization' } } } }
      responses:
        '200': { description: OK }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /api/law/search:
    get:
      tags: [pomocnik]
      summary: Szukanie przepisów i materiałów w lokalnym indeksie
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, maxLength: 500 }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AssistantAnswer' } } } }
        '400': { $ref: '#/components/responses/Problem' }

  /api/assistant/suggestions:
    get:
      tags: [pomocnik]
      summary: Podpowiedzi pytań na pusty czat (z gotowych odpowiedzi FAQ)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { type: string } } } } }

  /api/assistant/ask:
    post:
      tags: [pomocnik]
      summary: Zapytaj o przepisy
      description: |
        Najpierw sprawdza gotowe odpowiedzi na typowe pytania rodziców (mode faq, bez modelu). Jeśli ich nie ma,
        wyszukuje przepisy do ogólnego pytania. Przy włączonym modelu może dodać odpowiedź z cytatami.
        Bez działającego modelu lub po wyczerpaniu limitu zwraca wyniki wyszukiwania.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AssistantQuestion' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AssistantAnswer' } } } }
        '400': { $ref: '#/components/responses/Problem' }
